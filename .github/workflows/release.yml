name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifact:
    name: Create release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release ref
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be an exact stable SemVer tag prefixed with v." >&2
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tag must point to a commit contained in main." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          printf 'RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
          cache: true

      - name: Validate suite release
        shell: bash
        run: |
          set -euo pipefail
          mise run release:validate -- "$GITHUB_REF_NAME"

      - name: Run local CI mirror
        shell: bash
        run: |
          set -euo pipefail
          mise run ci

      - name: Build release artifact and notes
        shell: bash
        run: |
          set -euo pipefail
          mise run release:artifact -- .dev/out/release
          mise run release:notes -- "${GITHUB_REF_NAME#v}" .dev/out/release/release-notes.md

      - name: Checksum release artifact
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          directory=".dev/out/release"
          tarball=".dev/out/release/finos-morphir-ir-${version}.tgz"
          test -f "$tarball"
          mapfile -t tarballs < <(find "$directory" -maxdepth 1 -type f -name '*.tgz' -printf '%f\n')
          if [[ "${#tarballs[@]}" -ne 1 || "${tarballs[0]}" != "$(basename "$tarball")" ]]; then
            echo "Release output must contain exactly the expected npm tarball." >&2
            exit 1
          fi
          (
            cd "$directory"
            sha256sum "$(basename "$tarball")" > SHA256SUMS
          )

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: morphir-ir-release
          path: |
            .dev/out/release/finos-morphir-ir-${{ env.RELEASE_VERSION }}.tgz
            .dev/out/release/release-notes.md
            .dev/out/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: true

  publish:
    name: Publish @finos/morphir-ir
    needs: artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: morphir-ir-release
          path: .dev/out/release

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          scope: "@finos"

      - name: Verify release artifact
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be an exact stable SemVer tag prefixed with v." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          directory=".dev/out/release"
          expected_name="finos-morphir-ir-${version}.tgz"
          tarball="${directory}/${expected_name}"
          mapfile -t files < <(find "$directory" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          if [[ "${#files[@]}" -ne 3 || "${files[0]}" != "SHA256SUMS" || "${files[1]}" != "$expected_name" || "${files[2]}" != "release-notes.md" ]]; then
            echo "Downloaded release artifact has unexpected files." >&2
            exit 1
          fi
          (
            cd "$directory"
            test "$(wc -l < SHA256SUMS)" -eq 1
            checksum_line="$(cat SHA256SUMS)"
            checksum_hash="${checksum_line%% *}"
            checksum_name="${checksum_line#*  }"
            [[ "$checksum_hash" =~ ^[0-9a-f]{64}$ ]]
            [[ "$checksum_name" == "$expected_name" ]]
            [[ "$checksum_line" == "$checksum_hash  $checksum_name" ]]
            sha256sum --check --strict SHA256SUMS
          )
          test -f "$tarball"

      - name: Publish @finos/morphir-ir
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          tarball=".dev/out/release/finos-morphir-ir-${version}.tgz"
          npm publish "$tarball" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ORG_MORPHIR_NPM_TOKEN }}

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: morphir-ir-release
          path: .dev/out/release

      - name: Verify release artifact
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be an exact stable SemVer tag prefixed with v." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          directory=".dev/out/release"
          expected_name="finos-morphir-ir-${version}.tgz"
          tarball="${directory}/${expected_name}"
          mapfile -t files < <(find "$directory" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          if [[ "${#files[@]}" -ne 3 || "${files[0]}" != "SHA256SUMS" || "${files[1]}" != "$expected_name" || "${files[2]}" != "release-notes.md" ]]; then
            echo "Downloaded release artifact has unexpected files." >&2
            exit 1
          fi
          (
            cd "$directory"
            test "$(wc -l < SHA256SUMS)" -eq 1
            checksum_line="$(cat SHA256SUMS)"
            checksum_hash="${checksum_line%% *}"
            checksum_name="${checksum_line#*  }"
            [[ "$checksum_hash" =~ ^[0-9a-f]{64}$ ]]
            [[ "$checksum_name" == "$expected_name" ]]
            [[ "$checksum_line" == "$checksum_hash  $checksum_name" ]]
            sha256sum --check --strict SHA256SUMS
          )
          test -f "$tarball"

      - name: Create GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          tarball=".dev/out/release/finos-morphir-ir-${version}.tgz"
          gh release create "$GITHUB_REF_NAME" \
            "$tarball" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --notes-file .dev/out/release/release-notes.md \
            --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
