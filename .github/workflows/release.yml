name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifact:
    name: Create release artifact
    if: ${{ github.event.deleted == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release ref
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be an exact stable SemVer tag prefixed with v." >&2
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tag must point to a commit contained in main." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          printf 'RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
          cache: true

      - name: Validate suite release
        shell: bash
        run: |
          set -euo pipefail
          mise run release:validate -- "$GITHUB_REF_NAME"

      - name: Run local CI mirror
        shell: bash
        run: |
          set -euo pipefail
          mise run ci

      - name: Build release artifact and notes
        shell: bash
        run: |
          set -euo pipefail
          mise run release:artifact -- .dev/out/release
          mise run release:binaries -- .dev/out/release
          mise run release:notes -- "${GITHUB_REF_NAME#v}" .dev/out/release/release-notes.md

      - name: Checksum release artifact
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          directory=".dev/out/release"
          artifacts=(
            "finos-morphir-ir-${version}.tgz"
            "finos-morphir-mck-${version}.tgz"
            "mck-${version}-linux-x64"
            "mck-adapter-typescript-${version}-linux-x64"
            "mck-${version}-linux-arm64"
            "mck-adapter-typescript-${version}-linux-arm64"
            "mck-${version}-darwin-x64"
            "mck-adapter-typescript-${version}-darwin-x64"
            "mck-${version}-darwin-arm64"
            "mck-adapter-typescript-${version}-darwin-arm64"
            "mck-${version}-windows-x64.exe"
            "mck-adapter-typescript-${version}-windows-x64.exe"
          )
          mapfile -t checksummed < <(printf '%s\n' "${artifacts[@]}" | LC_ALL=C sort)
          mapfile -t files < <(find "$directory" -maxdepth 1 -type f ! -name release-notes.md -printf '%f\n' | LC_ALL=C sort)
          if [[ "${files[*]}" != "${checksummed[*]}" ]]; then
            echo "Release output must contain exactly the expected npm tarballs and binaries." >&2
            printf 'expected: %s\n' "${checksummed[*]}" >&2
            printf 'found: %s\n' "${files[*]}" >&2
            exit 1
          fi
          (
            cd "$directory"
            sha256sum "${checksummed[@]}" > SHA256SUMS
          )

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: morphir-ir-release
          path: |
            .dev/out/release/finos-morphir-ir-${{ env.RELEASE_VERSION }}.tgz
            .dev/out/release/finos-morphir-mck-${{ env.RELEASE_VERSION }}.tgz
            .dev/out/release/mck-${{ env.RELEASE_VERSION }}-*
            .dev/out/release/mck-adapter-typescript-${{ env.RELEASE_VERSION }}-*
            .dev/out/release/release-notes.md
            .dev/out/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: true

  publish:
    name: Publish npm packages
    needs: artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: morphir-ir-npm-publish
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: morphir-ir-release
          path: .dev/out/release

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          scope: "@finos"

      - name: Verify release artifact
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be an exact stable SemVer tag prefixed with v." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          directory=".dev/out/release"
          artifacts=(
            "finos-morphir-ir-${version}.tgz"
            "finos-morphir-mck-${version}.tgz"
            "mck-${version}-linux-x64"
            "mck-adapter-typescript-${version}-linux-x64"
            "mck-${version}-linux-arm64"
            "mck-adapter-typescript-${version}-linux-arm64"
            "mck-${version}-darwin-x64"
            "mck-adapter-typescript-${version}-darwin-x64"
            "mck-${version}-darwin-arm64"
            "mck-adapter-typescript-${version}-darwin-arm64"
            "mck-${version}-windows-x64.exe"
            "mck-adapter-typescript-${version}-windows-x64.exe"
          )
          mapfile -t checksummed < <(printf '%s\n' "${artifacts[@]}" | LC_ALL=C sort)
          mapfile -t expected < <(printf '%s\n' "${artifacts[@]}" SHA256SUMS release-notes.md | LC_ALL=C sort)
          mapfile -t files < <(find "$directory" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          if [[ "${files[*]}" != "${expected[*]}" ]]; then
            echo "Downloaded release artifact has unexpected files." >&2
            printf 'expected: %s\n' "${expected[*]}" >&2
            printf 'found: %s\n' "${files[*]}" >&2
            exit 1
          fi
          (
            cd "$directory"
            test "$(wc -l < SHA256SUMS)" -eq "${#checksummed[@]}"
            mapfile -t checksum_names < <(cut -d ' ' -f 3- SHA256SUMS)
            if [[ "${checksum_names[*]}" != "${checksummed[*]}" ]]; then
              echo "SHA256SUMS does not cover exactly the expected files." >&2
              exit 1
            fi
            while IFS= read -r checksum_line; do
              checksum_hash="${checksum_line%% *}"
              checksum_name="${checksum_line#*  }"
              [[ "$checksum_hash" =~ ^[0-9a-f]{64}$ ]]
              [[ "$checksum_line" == "$checksum_hash  $checksum_name" ]]
            done < SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          for artifact in "${artifacts[@]}"; do
            test -f "${directory}/${artifact}"
          done

      # The publish job never checks out the repository, so its Node helpers are
      # written here instead of read from the tree. They are separate from the
      # publish step because actionlint 1.7.12 deadlocks on Windows when it
      # feeds a `run:` script longer than the 4 KiB pipe buffer to shellcheck,
      # which would break the local `mise run ci` mirror.
      - name: Write publish helpers
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/tarball-integrity.cjs" <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync } = require("node:fs");
          const tarball = process.argv[2];
          const digest = createHash("sha512").update(readFileSync(tarball)).digest("base64");
          process.stdout.write(`sha512-${digest}`);
          NODE
          cat > "$RUNNER_TEMP/published-integrity.cjs" <<'NODE'
          const input = process.argv[2];
          let integrity;
          try {
            integrity = JSON.parse(input);
          } catch {
            process.exit(1);
          }
          if (typeof integrity !== "string" || !integrity.startsWith("sha512-")) process.exit(1);
          process.stdout.write(integrity);
          NODE
          cat > "$RUNNER_TEMP/compare-versions.cjs" <<'NODE'
          const [targetInput, latestJson] = process.argv.slice(2);
          const stableVersion = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
          function parseVersion(input, description) {
            if (typeof input !== "string" || !stableVersion.test(input)) {
              console.error(`${description} must be an exact stable SemVer version.`);
              process.exit(1);
            }
            return input.split(".").map((part) => BigInt(part));
          }
          let latestInput;
          try {
            latestInput = JSON.parse(latestJson);
          } catch {
            console.error("npm returned invalid JSON for dist-tags.latest.");
            process.exit(1);
          }
          const target = parseVersion(targetInput, "Target version");
          const latest = parseVersion(latestInput, "Latest published version");
          for (let index = 0; index < target.length; index += 1) {
            if (target[index] < latest[index]) {
              process.stdout.write("older");
              process.exit(0);
            }
            if (target[index] > latest[index]) {
              process.stdout.write("newer");
              process.exit(0);
            }
          }
          process.stdout.write("equal");
          NODE

      - name: Publish npm packages
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          published_integrity() {
            local package_name="$1"
            local package_version="$2"
            local integrity_json
            integrity_json="$(npm view "${package_name}@${package_version}" dist.integrity --json --registry=https://registry.npmjs.org 2>/dev/null)" || return 1
            node "$RUNNER_TEMP/published-integrity.cjs" "$integrity_json"
          }

          # @finos/morphir-mck depends on @finos/morphir-ir, so ir publishes
          # first: a failure there stops the tag before mck can reference a
          # version the registry does not have.
          for package_name in "@finos/morphir-ir" "@finos/morphir-mck"; do
            tarball=".dev/out/release/finos-${package_name#@finos/}-${version}.tgz"
            local_integrity="$(node "$RUNNER_TEMP/tarball-integrity.cjs" "$tarball")"

            latest_error="$(mktemp)"
            if latest_json="$(npm view "$package_name" dist-tags.latest --json --registry=https://registry.npmjs.org 2>"$latest_error")"; then
              latest_present=true
            else
              latest_status=$?
              if grep -Eq '(^|[[:space:]])E404([[:space:]]|$)' "$latest_error"; then
                latest_present=false
              else
                rm -f "$latest_error"
                echo "Could not confirm the latest published version of ${package_name}." >&2
                exit "$latest_status"
              fi
            fi
            rm -f "$latest_error"

            if [[ "$latest_present" == true ]]; then
              comparison="$(node "$RUNNER_TEMP/compare-versions.cjs" "$version" "$latest_json")"

              if [[ "$comparison" == "older" ]]; then
                echo "Target version is older than npm's latest version of ${package_name}." >&2
                exit 1
              fi
              if [[ "$comparison" == "equal" ]]; then
                remote_integrity="$(published_integrity "$package_name" "$version")" || {
                  echo "Could not verify the existing npm package integrity for ${package_name}." >&2
                  exit 1
                }
                if [[ "$remote_integrity" == "$local_integrity" ]]; then
                  echo "The identical ${package_name} version is already published."
                  continue
                fi
                echo "The published ${package_name} integrity does not match this artifact." >&2
                exit 1
              fi
            fi

            set +e
            npm publish "$tarball" --access public --provenance
            publish_status=$?
            set -e
            if [[ "$publish_status" -eq 0 ]]; then
              continue
            fi

            echo "npm publish returned an error; checking whether the registry accepted ${package_name}." >&2
            confirmed=false
            for attempt in 1 2 3 4 5; do
              remote_integrity="$(published_integrity "$package_name" "$version")" || remote_integrity=""
              if [[ "$remote_integrity" == "$local_integrity" ]]; then
                confirmed=true
                break
              fi
              if [[ "$attempt" -lt 5 ]]; then
                sleep "$((attempt * 2))"
              fi
            done
            if [[ "$confirmed" != true ]]; then
              echo "npm did not confirm ${package_name} with the expected integrity." >&2
              exit "$publish_status"
            fi
            echo "npm contains ${package_name} with the expected integrity."
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ORG_MORPHIR_NPM_TOKEN }}

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: morphir-ir-release
          path: .dev/out/release

      - name: Verify release artifact
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be an exact stable SemVer tag prefixed with v." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          directory=".dev/out/release"
          artifacts=(
            "finos-morphir-ir-${version}.tgz"
            "finos-morphir-mck-${version}.tgz"
            "mck-${version}-linux-x64"
            "mck-adapter-typescript-${version}-linux-x64"
            "mck-${version}-linux-arm64"
            "mck-adapter-typescript-${version}-linux-arm64"
            "mck-${version}-darwin-x64"
            "mck-adapter-typescript-${version}-darwin-x64"
            "mck-${version}-darwin-arm64"
            "mck-adapter-typescript-${version}-darwin-arm64"
            "mck-${version}-windows-x64.exe"
            "mck-adapter-typescript-${version}-windows-x64.exe"
          )
          mapfile -t checksummed < <(printf '%s\n' "${artifacts[@]}" | LC_ALL=C sort)
          mapfile -t expected < <(printf '%s\n' "${artifacts[@]}" SHA256SUMS release-notes.md | LC_ALL=C sort)
          mapfile -t files < <(find "$directory" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          if [[ "${files[*]}" != "${expected[*]}" ]]; then
            echo "Downloaded release artifact has unexpected files." >&2
            printf 'expected: %s\n' "${expected[*]}" >&2
            printf 'found: %s\n' "${files[*]}" >&2
            exit 1
          fi
          (
            cd "$directory"
            test "$(wc -l < SHA256SUMS)" -eq "${#checksummed[@]}"
            mapfile -t checksum_names < <(cut -d ' ' -f 3- SHA256SUMS)
            if [[ "${checksum_names[*]}" != "${checksummed[*]}" ]]; then
              echo "SHA256SUMS does not cover exactly the expected files." >&2
              exit 1
            fi
            while IFS= read -r checksum_line; do
              checksum_hash="${checksum_line%% *}"
              checksum_name="${checksum_line#*  }"
              [[ "$checksum_hash" =~ ^[0-9a-f]{64}$ ]]
              [[ "$checksum_line" == "$checksum_hash  $checksum_name" ]]
            done < SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          for artifact in "${artifacts[@]}"; do
            test -f "${directory}/${artifact}"
          done

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # Everything the artifact carries except the release notes, which are
          # the release body rather than an asset.
          mapfile -t uploads < <(find .dev/out/release -maxdepth 1 -type f ! -name release-notes.md -printf '%p\n' | LC_ALL=C sort)
          test "${#uploads[@]}" -eq 13
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file .dev/out/release/release-notes.md \
              --title "$tag"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --notes-file .dev/out/release/release-notes.md \
              --title "$tag"
          fi
          gh release upload "$tag" "${uploads[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}
